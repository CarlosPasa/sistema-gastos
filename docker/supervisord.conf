[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Worker de la cola: procesa las importaciones de extractos.
; --max-time reinicia el proceso cada hora (libera memoria); supervisord lo
; vuelve a levantar. stopwaitsecs deja terminar el job en curso al desplegar.
[program:queue-worker]
command=/usr/local/bin/php /var/www/html/artisan queue:work database --sleep=3 --tries=3 --timeout=120 --max-time=3600 --memory=128
user=www-data
priority=30
autostart=true
autorestart=true
stopwaitsecs=130
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
