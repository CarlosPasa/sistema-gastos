services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:10000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: mt2
      DB_USERNAME: mt2_user
      DB_PASSWORD: ${MT2_DB_PASSWORD:-mt2_local_2026}
    volumes:
      - ./:/var/www/html
      - mt2_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mt2
      POSTGRES_USER: mt2_user
      POSTGRES_PASSWORD: ${MT2_DB_PASSWORD:-mt2_local_2026}
    volumes:
      - mt2_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt2_user -d mt2"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  mt2_pgdata:
  mt2_vendor:
